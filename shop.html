<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - My Shop</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Arial} body{margin:0;background:#f9fafb;color:#111}
header{background:#111;color:white;padding:14px 20px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:20px} header a{color:white;text-decoration:none;margin-left:16px;font-size:14px;font-weight:600}
.container{max-width:1300px;margin:0 auto;padding:20px;display:grid;grid-template-columns:1fr 360px;gap:20px}
@media(max-width:950px){.container{grid-template-columns:1fr}}
.search-bar{grid-column:1/-1}.search-bar input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:white;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,0.06);overflow:hidden;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);transition:.2s}
.card img{width:100%;height:200px;object-fit:cover;background:#f3f4f6}
.card-body{padding:12px;display:flex;flex-direction:column;flex:1}
.card-body h3{margin:0 0 4px;font-size:15px}
.price{font-size:17px;font-weight:700;margin-bottom:6px;color:#059669}
.desc{font-size:12px;color:#666;flex:1;margin-bottom:10px}
.btn{width:100%;padding:10px;background:#111;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{background:#25D366}
.cart-sidebar{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.08);height:fit-content;position:sticky;top:80px}
.cart-sidebar h2{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.cart-count{background:#25D366;color:white;border-radius:20px;padding:2px 8px;font-size:12px}
.cart-item{display:flex;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #eee}
.cart-item img{width:60px;height:60px;object-fit:cover;border-radius:6px;background:#f3f4f6}
.cart-info{flex:1;font-size:13px}.cart-info b{display:block;font-size:14px}
.qty-controls{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty-btn{width:26px;height:26px;border:1px solid #ddd;background:white;border-radius:5px;cursor:pointer;font-weight:700}
.remove{color:#dc2626;cursor:pointer;font-size:12px;background:none;border:none;padding:0;margin-top:4px}
.summary-row{display:flex;justify-content:space-between;margin:8px 0;font-size:14px}
.total{font-size:18px;font-weight:700}
.checkout{width:100%;padding:14px;background:#25D366;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px;font-size:15px}
.checkout:hover{background:#1ebe5b}
.empty-cart,.empty{text-align:center;color:#666;padding:30px 10px}
.hidden{display:none}
.toast{position:fixed;bottom:20px;right:20px;background:#111;color:white;padding:12px 20px;border-radius:8px;display:none;z-index:999}
select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0}
</style>
<script src="https://checkout.flutterwave.com/v3.js"></script>
</head>
<body>
<header>
  <h1>My Shop 🛍️</h1>
  <div>
    <a href="Index.html">Back to Main</a>
    <a href="main.html">Home</a>
  </div>
</header>

<div class="container">
  <div>
    <div class="search-bar">
      <input id="search" type="text" placeholder="Search products..." onkeyup="renderShop()">
    </div>
    <div id="products" class="grid"></div>
    <div id="emptyShop" class="empty hidden">
      <h2>No products yet</h2>
    </div>
  </div>

  <div class="cart-sidebar">
    <h2>Cart <span id="cartCount" class="cart-count">0</span></h2>
    <div id="cartList"></div>
   <div id="cartSummary" class="hidden">
      <div class="summary-row"><span>Subtotal</span><span id="subtotal">K0.00</span></div>

      <label>Delivery Location:</label>
      <select id="delivery" onchange="renderCart()">
        <option value="0">Pickup in Ndola - Free</option>
        <option value="50">Delivery in Ndola - K50</option>
        <option value="100">Outside Ndola - K100</option>
      </select>

      <div class="summary-row"><span>Delivery</span><span id="deliveryFee">K0.00</span></div>
      <hr>
      <div class="summary-row total"><span>Total</span><span id="total">K0.00</span></div>

      <!-- Customer Details for Flutterwave -->
      <h3 style="font-size:14px;margin:12px 0 6px">Your Details</h3>
      <input id="custName" type="text" placeholder="Full Name" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px">
      <input id="custEmail" type="email" placeholder="Email Address" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px">
      <input id="custPhone" type="tel" placeholder="Phone: 096xxxxxxx" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px">

      <button class="checkout" onclick="checkoutWhatsApp()">Order on WhatsApp</button>
      <button class="checkout" style="background:#F5A623;margin-top:8px" onclick="payWithFlutterwave()">Pay with Flutterwave</button>
      <button class="btn" style="background:#555;margin-top:8px" onclick="clearCart()">Clear Cart</button>
    </div>
    <div id="emptyCart" class="empty-cart">
      Your cart is empty
      <br><a href="#products"><button class="btn" style="margin-top:10px">Continue Shopping</button></a>
    </div>
  </div>
</div>

<div id="toast" class="toast">Added to cart!</div>

<script>
const WHATSAPP_NUMBER = "260960636028"

function getProds(){ return JSON.parse(localStorage.getItem("products")||"[]") }
function getCart(){ return JSON.parse(localStorage.getItem("cart")||"[]") }
function saveCart(c){ localStorage.setItem("cart", JSON.stringify(c)) }

function showToast(msg){
  const t = document.getElementById("toast")
  t.innerText = msg
  t.style.display = "block"
  setTimeout(()=> t.style.display="none", 2000)
}

// RENDER SHOP
function renderShop(){
  const prods = getProds()
  const search = document.getElementById("search").value.toLowerCase()
  const filtered = prods.filter(p => p.n.toLowerCase().includes(search) || p.d.toLowerCase().includes(search))
  const grid = document.getElementById("products")
  const empty = document.getElementById("emptyShop")

  if(filtered.length === 0){
    grid.innerHTML = ""
    empty.classList.remove("hidden")
  } else {
    empty.classList.add("hidden")
    grid.innerHTML = filtered.map(p => `
      <div class="card">
        <img src="${p.i}" loading="lazy" onerror="this.src='https://via.placeholder.com/230x200'">
        <div class="card-body">
          <h3>${p.n}</h3>
          <div class="price">K${p.p}</div>
          <div class="desc">${p.d || ''}</div>
          <button class="btn" onclick="addToCart(${p.id})">Add to Cart</button>
        </div>
      </div>
    `).join("")
  }
  renderCart()
}

function addToCart(id){
  let cart = getCart()
  cart.push(id)
  saveCart(cart)
  renderCart()
  showToast("Added to cart!")
}

// RENDER CART
function renderCart(){
  const cart = getCart()
  const products = getProds()
  const cartList = document.getElementById("cartList")
  const summary = document.getElementById("cartSummary")
  const empty = document.getElementById("emptyCart")
  const deliveryFee = parseFloat(document.getElementById("delivery").value)
  
  document.getElementById("cartCount").innerText = cart.length

  if(cart.length === 0){
    cartList.innerHTML = ""
    summary.classList.add("hidden")
    empty.classList.remove("hidden")
    return
  }

  empty.classList.add("hidden")
  summary.classList.remove("hidden")
  const cartCount = {}
  cart.forEach(id => cartCount[id] = (cartCount[id]||0) + 1)

  let subtotal = 0
  let message = "Hello! I want to order:\n\n"

  cartList.innerHTML = Object.keys(cartCount).map(id => {
    const p = products.find(x => x.id == id)
    if(!p) return ''
    const qty = cartCount[id]
    const itemTotal = parseFloat(p.p) * qty
    subtotal += itemTotal
    message += `• ${p.n} x ${qty} = K${itemTotal.toFixed(2)}\n`
    return `
      <div class="cart-item">
        <img src="${p.i}" onerror="this.src='https://via.placeholder.com/60'">
        <div class="cart-info">
          <b>${p.n}</b> K${p.p} x ${qty} = K${itemTotal.toFixed(2)}
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty(${id}, -1)">-</button>
            <span>${qty}</span>
            <button class="qty-btn" onclick="updateQty(${id}, 1)">+</button>
          </div>
          <button class="remove" onclick="removeItem(${id})">Remove</button>
        </div>
      </div>
    `
  }).join("")

  const total = subtotal + deliveryFee
  message += `\nSubtotal: K${subtotal.toFixed(2)}\nDelivery: K${deliveryFee.toFixed(2)}\nTotal: K${total.toFixed(2)}`
  window.orderMessage = message

  document.getElementById("subtotal").innerText = `K${subtotal.toFixed(2)}`
  document.getElementById("deliveryFee").innerText = `K${deliveryFee.toFixed(2)}`
  document.getElementById("total").innerText = `K${total.toFixed(2)}`
}

function updateQty(id, change){
  let cart = getCart()
  if(change === 1){ cart.push(id) }
  else { const index = cart.indexOf(id); if(index > -1) cart.splice(index, 1) }
  saveCart(cart); renderCart()
}

function removeItem(id){
  let cart = getCart().filter(x => x!= id)
  saveCart(cart); renderCart()
}

function clearCart(){
  if(confirm("Clear all items from cart?")){
    localStorage.removeItem("cart")
    renderCart()
  }
}
function checkoutWhatsApp(){
  if(getCart().length === 0) return alert("Cart is empty")
  const text = encodeURIComponent(window.orderMessage + "\n\nName: \nAddress: \nPhone: ")
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${text}`
  window.open(url, '_blank')
  clearCart() // clear cart after sending order
}

// PASTE THE NEW FUNCTION HERE ON LINE 169
function payWithFlutterwave(){
  if(getCart().length === 0) return alert("Cart is empty")

  const name = document.getElementById("custName").value.trim()
  const email = document.getElementById("custEmail").value.trim()
  const phone = document.getElementById("custPhone").value.trim()

  if(!name ||!email ||!phone){
    return alert("Please fill in Name, Email and Phone")
  }

  const products = getProds()
  const deliveryFee = parseFloat(document.getElementById("delivery").value)
  const cart = getCart()

  const cartCount = {}
  cart.forEach(id => cartCount[id] = (cartCount[id]||0) + 1)

  let subtotal = 0
  Object.keys(cartCount).forEach(id => {
    const p = products.find(x => x.id == id)
    if(!p) return
    const qty = cartCount[id]
    subtotal += parseFloat(p.p) * qty
  })

  const total = subtotal + deliveryFee

  FlutterwaveCheckout({
    public_key: "FLWPUBK_TEST-YOURKEYHERE", // <-- Replace with your live key
    tx_ref: "myShop_" + Date.now(),
    amount: total,
    currency: "ZMW",
    payment_options: "card,mobilemoney,ussd",
    customer: { email: email, phone_number: phone, name: name },
    customizations: { title: "My Shop", description: "Payment for your order", logo: "https://via.placeholder.com/100" },
    callback: function (data) {
      if(data.status === "successful"){ alert("Payment successful! We will contact you soon."); clearCart() }
      else { alert("Payment not completed") }
    },
    onclose: function() {}
  });
}

renderShop() // This was originally line 169
window.addEventListener('storage', renderShop);
</script>
</body>
</html>
