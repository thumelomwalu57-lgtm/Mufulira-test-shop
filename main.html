<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Shop</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,Arial;scroll-behavior:smooth}
  body{margin:0;background:#f9fafb;color:#111}
  nav {background: #111; padding: 12px 20px; position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center}
  .logo{display:flex;align-items:center;gap:10px;color:white;font-weight:700;font-size:20px}
  .logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:white}
  nav a {color: #fff; text-decoration: none; font-weight: 600; margin-left:16px}
  nav a:hover{color:#25D366}
  .btn{padding:14px 32px;border-radius:50px;border:none;background:#111;color:white;font-weight:700;font-size:16px;cursor:pointer}
  .btn:hover{background:#25D366}
  .btn-green{background:#25D366}
  .btn-green:hover{background:#1ebe5b}

  /* HERO */
  .hero{background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)), url('https://picsum.photos/1600/600') center/cover; color:white;text-align:center;padding:120px 20px}
  .hero h1{font-size:48px;margin:0 0 10px}
  .hero p{font-size:18px;margin-bottom:20px}

  /* SECTIONS */
  .container{max-width:1100px;margin:0 auto;padding:60px 20px}
  .section-title{text-align:center;font-size:32px;margin-bottom:40px}
  
  /* ABOUT */
  .about{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
  .about img{width:100%;border-radius:12px}
  @media(max-width:800px){.about{grid-template-columns:1fr}}

  /* FEATURES */
  .features{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
  .feature-card{background:white;padding:24px;border-radius:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
  .feature-icon{font-size:40px;margin-bottom:10px}

  /* CONTACT */
  .contact{display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .contact-info{background:white;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
  .contact-info p{margin:12px 0;font-size:15px}
  .contact-form input, .contact-form textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
  .map{width:100%;height:250px;border:0;border-radius:12px;margin-top:15px}
  @media(max-width:800px){.contact{grid-template-columns:1fr}}      
  /*BUTTON*/
.btn-gradient {
  background: linear-gradient(90deg, #2E7D32, #FFD700, #2E7D32);
  background-size: 200% 100%;
  color: white;
  padding: 14px 32px;
  border: none;
  border-radius: 50px;
  font-weight: 600;
  cursor: pointer;
  animation: gradientMove 3s infinite;
}
@keyframes gradientMove {
 0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

</style>
</head>
<section class="hero">
      <style>.btn-gradient {
  background: linear-gradient(90deg, #2E7D32, #FFD700, #2E7D32);
  background-size: 200% 100%;
  color: white;
  padding: 14px 32px;
  border: none;
  border-radius: 50px;
  font-weight: 600;
  cursor: pointer;
  animation: gradientMove 3s infinite;
}
@keyframes gradientMove {
 0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}
</style>
  <h1>Welcome to My Shop 🛍️</h1>
  <p>We sell simple, good stuff.</p>
  <a href="shop.html"><button class="btn">Shop Now</button></a>
</section>
</body>
</html>
